name: Build, push & deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate: types + build + tests must pass before we build/deploy an image ────
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinetrak
          POSTGRES_PASSWORD: kinetrak
          POSTGRES_DB: kinetrak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinetrak -d kinetrak"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://kinetrak:kinetrak@localhost:5432/kinetrak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck:server
      - run: npm run build
      - run: npm test

  docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/junixlabs/kinetrak
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Auto-deploy: SSH into the VPS and roll the new :latest image ────────────
  # Runs only for main pushes (which update the `latest` tag). The server already
  # has /opt/kinetrak/docker-compose.yml (binds 127.0.0.1:54440 behind Cloudflare
  # Tunnel + a named data volume) — we only pull + restart, never overwrite it.
  # Secrets: DEPLOY_HOST · DEPLOY_USER · DEPLOY_SSH_KEY (required);
  #          DEPLOY_PATH · DEPLOY_HEALTH_PORT (optional vars, default /opt/kinetrak · 54440).
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/kinetrak' }}
      HEALTH_PORT: ${{ vars.DEPLOY_HEALTH_PORT || '54440' }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull image & restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd '$DEPLOY_PATH'
             docker compose pull
             docker compose up -d
             docker image prune -f >/dev/null
             for i in \$(seq 1 15); do
               if curl -sf http://127.0.0.1:$HEALTH_PORT/api/health >/dev/null; then
                 echo '✓ KineTrak healthy'; exit 0
               fi
               sleep 2
             done
             echo '✗ health check failed'; docker compose logs --tail=30 kinetrak; exit 1"
